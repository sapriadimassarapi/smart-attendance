<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#17356b"
  >

  <title>Smart Attendance</title>


  <!-- QR Scanner Library -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      min-height: 100%;

    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background-color: #f4f7fb;

      background-image:
        radial-gradient(
          circle,
          rgba(23,53,107,0.08) 1.4px,
          transparent 1.5px
        );

      background-size: 22px 22px;

      color: #17213c;

      text-align: center;

      min-height: 100svh;

      overflow-x: hidden;

    }


    .container {

      width: 100%;

      max-width: 430px;

      margin: auto;

      padding:
        max(10px, env(safe-area-inset-top))
        12px
        max(10px, env(safe-area-inset-bottom));

      min-height: 100svh;

      display: flex;

      flex-direction: column;

    }


    .logo {

      font-size: 30px;

      line-height: 1;

      margin: 0 0 2px;

    }


    h1 {

      margin: 0;

      font-size: clamp(22px, 6vw, 27px);

      font-weight: 900;

    }


    .subtitle {

      color: #777;

      font-size: 11px;

      letter-spacing: 1px;

      margin: 2px 0 8px;

    }


    #startButton {

      width: 100%;

      padding: 12px;

      border: none;

      border-radius: 12px;

      background: #17356b;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      margin-bottom: 8px;

    }


    #startButton:disabled {

      opacity: 0.65;

    }


    .reader-shell {

      width: min(100%, 44svh);

      aspect-ratio: 1 / 1;

      margin: 0 auto;

      position: relative;

      border-radius: 16px;

      overflow: hidden;

      background: white;

      box-shadow:
        0 4px 16px
        rgba(0,0,0,0.10);

    }


    #reader {

      width: 100%;

      height: 100%;

      background: white;

    }


    #reader video {

      width: 100% !important;

      height: 100% !important;

      object-fit: cover !important;

      border-radius: 16px;

    }


    /*
      Sembunyikan panduan asal pustaka. Sesetengah kamera telefon
      memaparkannya mengikut nisbah video lalu kelihatan memanjang.
    */
    #reader #qr-shaded-region {

      display: none !important;

    }


    /* Panduan imbasan buatan sendiri: sentiasa tepat 1:1. */
    .scan-guide {

      position: absolute;

      top: 50%;

      left: 50%;

      width: 72%;

      aspect-ratio: 1 / 1;

      transform: translate(-50%, -50%);

      box-shadow:
        0 0 0 999px
        rgba(0,0,0,0.36);

      pointer-events: none;

      z-index: 20;

      display: none;

    }


    .reader-shell.scanning .scan-guide {

      display: block;

    }


    .scan-guide::after {

      content: "";

      position: absolute;

      left: 7%;

      top: 10%;

      width: 86%;

      height: 3px;

      border-radius: 999px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #61e248 15%,
          #baffad 50%,
          #61e248 85%,
          transparent
        );

      box-shadow:
        0 0 10px
        rgba(97,226,72,0.95);

      animation:
        scanLine 2.2s
        ease-in-out
        infinite;

    }


    @keyframes scanLine {

      0%,
      100% {
        top: 10%;
        opacity: 0.35;
      }

      50% {
        top: 88%;
        opacity: 1;
      }

    }


    .scan-corner {

      position: absolute;

      width: 22%;

      height: 22%;

      border-color: #45c72f;

      border-style: solid;

    }


    .scan-corner.top-left {
      top: 0;
      left: 0;
      border-width: 5px 0 0 5px;
    }


    .scan-corner.top-right {
      top: 0;
      right: 0;
      border-width: 5px 5px 0 0;
    }


    .scan-corner.bottom-left {
      bottom: 0;
      left: 0;
      border-width: 0 0 5px 5px;
    }


    .scan-corner.bottom-right {
      right: 0;
      bottom: 0;
      border-width: 0 5px 5px 0;
    }


    #result {

      width: 100%;

      margin-top: 8px;

      min-height: 125px;

      background: white;

      border-radius: 16px;

      padding: 10px 12px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

    }


    .icon {

      font-size: 26px;

      margin-bottom: 3px;

    }


    .title {

      font-size: 17px;

      font-weight: bold;

    }


    .name {

      font-size: clamp(21px, 7vw, 28px);

      font-weight: 900;

      line-height: 1.08;

      margin: 4px 0;

      overflow-wrap: anywhere;

    }


    .class {

      font-size: 15px;

    }


    .status {

      margin-top: 4px;

      font-size: 15px;

      font-weight: bold;

    }


    .time {

      margin-top: 3px;

      color: #777;

      font-size: 13px;

    }


    .waiting {

      font-size: 15px;

      color: #666;

    }


    .small {

      margin-top: 6px;

      color: #8a8f9c;

      font-size: 11px;

    }


    #settingsButton {

      margin-top: 3px;

      background: none;

      border: none;

      color: #697386;

      text-decoration: underline;

      cursor: pointer;

      font-size: 11px;

    }


    /* Sembunyikan teks dalaman pustaka seperti "Scanner paused". */
    #reader [id$="__status_span"] {

      display: none !important;

    }


    .scan-info {

      width: 100%;

      margin-top: 8px;

      padding: 12px;

      border-radius: 16px;

      background:
        linear-gradient(
          145deg,
          #17356b,
          #0f254d
        );

      color: white;

      display: flex;

      flex: 1;

      min-height: 126px;

      flex-direction: column;

      justify-content: center;

      box-shadow:
        0 8px 24px
        rgba(23,53,107,0.18);

      overflow: hidden;

      position: relative;

    }


    .scan-info::before {

      content: "✦  ✧  ✦";

      position: absolute;

      right: -3px;

      top: -13px;

      color: rgba(255,255,255,0.10);

      font-size: 54px;

      transform: rotate(-8deg);

    }


    .scan-info-title {

      font-size: 12px;

      font-weight: 900;

      letter-spacing: 1px;

      margin-bottom: 8px;

      position: relative;

    }


    .scan-info-title::before {

      content: "";

      display: inline-block;

      width: 8px;

      height: 8px;

      margin-right: 6px;

      border-radius: 50%;

      background: #61e248;

      box-shadow: 0 0 8px #61e248;

    }


    .scan-tips {

      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 6px;

      position: relative;

    }


    .scan-tip {

      padding: 8px 5px;

      border-radius: 10px;

      background: rgba(255,255,255,0.10);

      font-size: 10px;

      line-height: 1.25;

    }


    .scan-tip-icon {

      display: block;

      margin-bottom: 3px;

      font-size: 18px;

    }


    .privacy-note {

      margin-top: 8px;

      font-size: 9px;

      color: rgba(255,255,255,0.72);

      position: relative;

    }


    @media (max-height: 720px) {

      .logo {
        display: none;
      }


      .reader-shell {
        width: min(100%, 40svh);
      }


      #result {
        min-height: 112px;
        padding: 8px 10px;
      }


      .small {
        display: none;
      }


      .scan-info {
        min-height: 92px;
        padding: 9px;
      }


      .scan-info-title {
        margin-bottom: 5px;
      }


      .scan-tip {
        padding: 5px 3px;
        font-size: 9px;
      }


      .scan-tip-icon {
        font-size: 15px;
      }


      .privacy-note {
        margin-top: 5px;
      }

    }

  </style>

</head>



<body>


<div class="container">


  <div class="logo">
    📱
  </div>


  <h1>
    SMART ATTENDANCE
  </h1>


  <div class="subtitle">
    IMBAS • REKOD • ANALISIS
  </div>



  <button
    id="startButton"
    onclick="startScanner()"
  >

    📷 AKTIFKAN KAMERA

  </button>



  <div
    id="readerShell"
    class="reader-shell"
  >

    <div id="reader"></div>

    <div
      class="scan-guide"
      aria-hidden="true"
    >
      <span class="scan-corner top-left"></span>
      <span class="scan-corner top-right"></span>
      <span class="scan-corner bottom-left"></span>
      <span class="scan-corner bottom-right"></span>
    </div>

  </div>



  <div id="result">

    <div class="icon">
      📷
    </div>

    <div class="waiting">
      Tekan AKTIFKAN KAMERA untuk bermula
    </div>

  </div>



  <div class="small">
    Smart Attendance System
  </div>


  <button
    id="settingsButton"
    onclick="ubahApiUrl()"
  >
    Tetapan sistem
  </button>


  <section class="scan-info" aria-label="Panduan imbasan">

    <div class="scan-info-title">
      PANDUAN IMBASAN
    </div>

    <div class="scan-tips">

      <div class="scan-tip">
        <span class="scan-tip-icon">▣</span>
        QR penuh dalam kotak
      </div>

      <div class="scan-tip">
        <span class="scan-tip-icon">☀️</span>
        Elakkan pantulan cahaya
      </div>

      <div class="scan-tip">
        <span class="scan-tip-icon">🔊</span>
        Pastikan volume dibuka
      </div>

    </div>

    <div class="privacy-note">
      🔒 Rekod dihantar terus ke Smart Attendance
    </div>

  </section>


</div>



<script>


// =================================================
// SMART ATTENDANCE
// =================================================


// =================================================
// API URL
// Disimpan dalam browser
// =================================================

let API_URL =
  localStorage.getItem(
    "smartAttendanceApiUrl"
  ) || "";



// =================================================
// PEMBOLEH UBAH SCANNER
// =================================================

let scanner = null;

let processing = false;

let cameraRunning = false;

let lastDecodedText = "";

let lastDecodedAt = 0;



// =================================================
// SISTEM AUDIO
// =================================================

let audioContext = null;

let audioUnlocked = false;



function initAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }


    // Buka kebenaran audio semasa sentuhan pengguna,
    // khususnya untuk Safari pada iPhone.
    if (!audioUnlocked) {

      const silentBuffer =
        audioContext.createBuffer(
          1,
          1,
          22050
        );

      const silentSource =
        audioContext.createBufferSource();

      silentSource.buffer =
        silentBuffer;

      silentSource.connect(
        audioContext.destination
      );

      silentSource.start(0);

      audioUnlocked = true;

    }

  }

  catch (error) {

    console.log(
      "Audio tidak disokong:",
      error
    );

  }

}



// =================================================
// MAIN BEEP FUNCTION
// =================================================

function playTone(
  frequency,
  duration,
  volume = 0.60,
  type = "square"
) {


  try {


    if (!audioContext) {

      initAudio();

    }


    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      type;


    oscillator.frequency.value =
      frequency;


    const now =
      audioContext.currentTime;


    // Serangan pantas dan pelepasan lembut menghasilkan
    // bunyi yang lebih kuat tanpa bunyi pecah di hujung.
    gain.gain.setValueAtTime(
      0.001,
      now
    );


    gain.gain.exponentialRampToValueAtTime(
      volume,
      now + 0.01
    );


    gain.gain.setValueAtTime(
      volume,
      now +
      Math.max(
        duration - 0.05,
        0.02
      )
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      now +
      duration
    );


    oscillator.start(
      now
    );


    oscillator.stop(
      now +
      duration +
      0.02
    );


  }

  catch (error) {

    console.log(
      "Sound error:",
      error
    );

  }

}



// =================================================
// BUNYI BERJAYA
// =================================================

function soundSuccess() {


  // Dua nada tinggi dan jelas.

  playTone(
    880,
    0.14,
    0.58,
    "square"
  );


  setTimeout(
    function() {

      playTone(
        1320,
        0.22,
        0.65,
        "square"
      );

    },

    110

  );

}



// =================================================
// BUNYI DUPLIKAT
// =================================================

function soundDuplicate() {


  playTone(
    550,
    0.16,
    0.58,
    "triangle"
  );


  setTimeout(
    function() {

      playTone(
        550,
        0.16,
        0.58,
        "triangle"
      );

    },

    170

  );

}



// =================================================
// BUNYI ERROR
// =================================================

function soundError() {


  playTone(
    240,
    0.20,
    0.65,
    "sawtooth"
  );


  setTimeout(
    function() {

      playTone(
        170,
        0.30,
        0.68,
        "sawtooth"
      );

    },

    160

  );

}



// =================================================
// SIMPAN / UBAH URL APPS SCRIPT
// =================================================

function dapatkanApiUrl() {


  if (
    API_URL &&
    API_URL.includes(
      "script.google.com"
    ) &&
    API_URL.endsWith(
      "/exec"
    )
  ) {

    return true;

  }


  const url =
    prompt(

      "Masukkan URL Google Apps Script Smart Attendance.\n\n" +

      "Pastikan URL berakhir dengan /exec"

    );


  if (!url) {

    return false;

  }


  const cleanUrl =
    url.trim();


  if (
    !cleanUrl.includes(
      "script.google.com"
    ) ||
    !cleanUrl.endsWith(
      "/exec"
    )
  ) {


    alert(
      "URL tidak sah.\n\n" +
      "Pastikan URL Google Apps Script berakhir dengan /exec"
    );


    return false;

  }


  API_URL =
    cleanUrl;


  localStorage.setItem(
    "smartAttendanceApiUrl",
    API_URL
  );


  return true;

}



// =================================================
// TUKAR URL APPS SCRIPT
// =================================================

function ubahApiUrl() {


  const url =
    prompt(

      "Masukkan URL Apps Script /exec:",

      API_URL

    );


  if (!url) {

    return;

  }


  const cleanUrl =
    url.trim();


  if (
    !cleanUrl.includes(
      "script.google.com"
    ) ||
    !cleanUrl.endsWith(
      "/exec"
    )
  ) {


    alert(
      "URL tidak sah."
    );


    return;

  }


  API_URL =
    cleanUrl;


  localStorage.setItem(
    "smartAttendanceApiUrl",
    API_URL
  );


  alert(
    "Tetapan Smart Attendance berjaya disimpan."
  );

}



// =================================================
// MULAKAN KAMERA
// =================================================

async function startScanner() {


  // Unlock audio pada iPhone / Android
  initAudio();


  // Pastikan API telah dimasukkan
  if (!dapatkanApiUrl()) {

    return;

  }


  const button =
    document.getElementById(
      "startButton"
    );


  button.disabled =
    true;


  button.innerHTML =
    "⏳ MEMBUKA KAMERA...";


  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">⏳</div>' +

    '<div class="waiting">' +

    'Meminta kebenaran kamera...' +

    '</div>';



  try {


    // =================================================
    // CIPTA QR SCANNER - QR SAHAJA UNTUK PRESTASI
    // =================================================

    scanner =
      new Html5Qrcode(
        "reader",
        {

          formatsToSupport: [
            Html5QrcodeSupportedFormats.QR_CODE
          ],

          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          },

          verbose: false

        }
      );



    // =================================================
    // MULAKAN SCANNER
    // =================================================

    await scanner.start(


      {
        facingMode: "environment"
      },


      {

        fps: 20,


        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.floor(
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              ) * 0.78
            );

          return {
            width: size,
            height: size
          };

        },


        aspectRatio: 1.0,


        // Kamera belakang tidak menghasilkan imej cermin.
        // Ini mengurangkan kerja decoder.
        disableFlip: true

      },

      onScanSuccess,


      function() {

        // Abaikan scan error biasa

      }


    );



    // Cuba gunakan fokus berterusan jika telefon menyokongnya.
    // Jika tidak disokong, scanner tetap berjalan seperti biasa.
    try {

      if (
        scanner.applyVideoConstraints
      ) {

        await scanner.applyVideoConstraints({
          advanced: [
            {
              focusMode: "continuous"
            }
          ]
        });

      }

    }

    catch (focusError) {

      console.log(
        "Fokus berterusan tidak disokong:",
        focusError
      );

    }



    cameraRunning =
      true;


    document.getElementById(
      "readerShell"
    ).classList.add(
      "scanning"
    );



    button.style.display =
      "none";



    readyForNextScan();


  }

  catch (error) {


    console.error(
      error
    );


    cameraRunning =
      false;


    document.getElementById(
      "readerShell"
    ).classList.remove(
      "scanning"
    );


    button.disabled =
      false;


    button.innerHTML =
      "📷 CUBA AKTIFKAN KAMERA SEMULA";


    document.getElementById(
      "result"
    ).innerHTML =

      '<div class="icon">❌</div>' +

      '<div class="title">' +

      'KAMERA TIDAK DAPAT DIBUKA' +

      '</div>' +

      '<div class="time">' +

      escapeHtml(

        error.message ||
        String(error)

      ) +

      '</div>';

  }

}



// =================================================
// QR BERJAYA DIBACA
// =================================================

function onScanSuccess(
  decodedText
) {


  if (processing) {

    return;

  }


  // Elakkan QR yang masih berada di hadapan kamera daripada
  // dihantar semula serta-merta sebagai rekod duplicate.
  if (
    decodedText === lastDecodedText &&
    Date.now() - lastDecodedAt < 3500
  ) {

    return;

  }


  lastDecodedText = decodedText;

  lastDecodedAt = Date.now();


  processing =
    true;



  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">⏳</div>' +

    '<div class="title">' +

    'MEREKOD KEHADIRAN...' +

    '</div>' +

    '<div class="time">' +

    'Sila tunggu sebentar' +

    '</div>';



  // Hantar QR kepada Apps Script
  sendToGoogleSheets(
    decodedText
  );

}



// =================================================
// HANTAR DATA KE GOOGLE APPS SCRIPT
// Menggunakan JSONP
// =================================================

function sendToGoogleSheets(
  qrValue
) {


  const callbackName =

    "smartAttendanceCallback_" +

    Date.now();



  const script =
    document.createElement(
      "script"
    );



  let completed =
    false;



  // =================================================
  // TIMEOUT KESELAMATAN
  // =================================================

  const timeout =
    setTimeout(
      function() {


        if (completed) {

          return;

        }


        completed =
          true;


        soundError();


        document.getElementById(
          "result"
        ).innerHTML =

          '<div class="icon">❌</div>' +

          '<div class="title">' +

          'SAMBUNGAN GAGAL' +

          '</div>' +

          '<div class="time">' +

          'Sila cuba semula.' +

          '</div>';



        cleanupJsonp(
          callbackName,
          script
        );


        prepareNextScan();


      },

      10000

    );



  // =================================================
  // CALLBACK DARIPADA APPS SCRIPT
  // =================================================

  window[
    callbackName
  ] =
    function(data) {


      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeout
      );


      try {


        showResult(
          data
        );


      }

      finally {


        cleanupJsonp(
          callbackName,
          script
        );


      }

    };



  // =================================================
  // BINA URL
  // =================================================

  const url =

    API_URL +

    "?action=scan" +

    "&id=" +

    encodeURIComponent(
      qrValue
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();



  script.src =
    url;



  // =================================================
  // CONNECTION ERROR
  // =================================================

  script.onerror =
    function() {


      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeout
      );


      soundError();


      document.getElementById(
        "result"
      ).innerHTML =

        '<div class="icon">❌</div>' +

        '<div class="title">' +

        'GAGAL HUBUNGI SISTEM' +

        '</div>' +

        '<div class="time">' +

        'Semak sambungan internet.' +

        '</div>';



      cleanupJsonp(
        callbackName,
        script
      );


      prepareNextScan();

    };



  document.body.appendChild(
    script
  );

}



// =================================================
// CLEANUP JSONP
// =================================================

function cleanupJsonp(
  callbackName,
  script
) {


  try {

    delete window[
      callbackName
    ];

  }

  catch (error) {}


  try {

    script.remove();

  }

  catch (error) {}

}



// =================================================
// PAPARKAN KEPUTUSAN
// =================================================

function showResult(
  data
) {


  // =================================================
  // KEHADIRAN BERJAYA
  // =================================================

  if (
    data &&
    data.success
  ) {


    soundSuccess();



    document.getElementById(
      "result"
    ).innerHTML =

      '<div class="icon">✅</div>' +

      '<div class="title">' +

      'KEHADIRAN DIREKOD' +

      '</div>' +

      '<div class="name">' +

      escapeHtml(
        data.nama
      ) +

      '</div>' +

      '<div class="class">' +

      escapeHtml(
        data.kelas
      ) +

      '</div>' +

      '<div class="status">' +

      escapeHtml(
        data.status
      ) +

      '</div>' +

      '<div class="time">' +

      escapeHtml(
        data.masa
      ) +

      '</div>';



    // Getaran pendek
    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        150
      );

    }


    prepareNextScan();


    return;

  }



  // =================================================
  // DUPLIKAT
  // =================================================

  if (
    data &&
    data.duplicate
  ) {


    soundDuplicate();



    document.getElementById(
      "result"
    ).innerHTML =

      '<div class="icon">⚠️</div>' +

      '<div class="title">' +

      'SUDAH DIREKOD' +

      '</div>' +

      '<div class="name">' +

      escapeHtml(
        data.nama
      ) +

      '</div>' +

      '<div class="class">' +

      escapeHtml(
        data.kelas || ""
      ) +

      '</div>' +

      '<div class="time">' +

      'Kehadiran hari ini sudah direkod.' +

      '</div>';



    // Getaran dua kali
    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [
          100,
          80,
          100
        ]
      );

    }


    prepareNextScan();


    return;

  }



  // =================================================
  // QR / ID TIDAK SAH
  // =================================================

  soundError();



  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">❌</div>' +

    '<div class="title">' +

    'QR TIDAK SAH' +

    '</div>' +

    '<div class="time">' +

    escapeHtml(

      data &&
      data.message

      ?

      data.message

      :

      "ID tidak dijumpai"

    ) +

    '</div>';



  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [
        200,
        100,
        200
      ]
    );

  }



  prepareNextScan();

}



// =================================================
// SEDIA UNTUK MURID SETERUSNYA
// =================================================

function prepareNextScan() {


  // Beri sela masa pendek sebelum decoder disambung semula.
  // Paparan keputusan terakhir sengaja tidak dipadam. Nama murid
  // kekal kelihatan sehingga QR seterusnya berjaya dibaca.

  setTimeout(
    function() {


      processing =
        false;


      // Mulakan kiraan sela selepas respons diterima. QR yang lain
      // masih boleh dibaca terus tanpa menunggu sela ini.
      lastDecodedAt =
        Date.now();


    },

    900

  );

}



// =================================================
// PAPARAN SCANNER READY
// =================================================

function readyForNextScan() {


  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">📷</div>' +

    '<div class="waiting">' +

    'Sila imbas QR murid' +

    '</div>';

}



// =================================================
// KESELAMATAN PAPARAN TEKS
// =================================================

function escapeHtml(
  text
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null

      ? ""

      : String(text);


  return div.innerHTML;

}


</script>
