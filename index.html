<!DOCTYPE html>
<html lang="ms">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#17356b"
  >

  <title>Smart Attendance</title>


  <!-- QR Scanner Library -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f7fb;

      color: #17213c;

      text-align: center;

    }


    .container {

      max-width: 520px;

      margin: auto;

      padding: 25px 18px 40px;

    }


    .logo {

      font-size: 45px;

      margin-top: 5px;

    }


    h1 {

      margin: 5px 0;

      font-size: 30px;

      font-weight: 900;

    }


    .subtitle {

      color: #777;

      font-size: 14px;

      letter-spacing: 1px;

      margin-bottom: 25px;

    }


    #startButton {

      width: 100%;

      padding: 17px;

      border: none;

      border-radius: 14px;

      background: #17356b;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      margin-bottom: 18px;

    }


    #startButton:disabled {

      opacity: 0.65;

    }


    #reader {

      width: 100%;

      border-radius: 18px;

      overflow: hidden;

      background: white;

    }


    #result {

      margin-top: 20px;

      min-height: 150px;

      background: white;

      border-radius: 18px;

      padding: 20px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.08);

    }


    .icon {

      font-size: 40px;

      margin-bottom: 8px;

    }


    .title {

      font-size: 22px;

      font-weight: bold;

    }


    .name {

      font-size: 32px;

      font-weight: 900;

      margin: 8px 0;

    }


    .class {

      font-size: 18px;

    }


    .status {

      margin-top: 8px;

      font-size: 18px;

      font-weight: bold;

    }


    .time {

      margin-top: 5px;

      color: #777;

      font-size: 15px;

    }


    .waiting {

      font-size: 18px;

      color: #666;

    }


    .small {

      margin-top: 16px;

      color: #8a8f9c;

      font-size: 12px;

    }


    #settingsButton {

      margin-top: 15px;

      background: none;

      border: none;

      color: #697386;

      text-decoration: underline;

      cursor: pointer;

      font-size: 12px;

    }

  </style>

</head>



<body>


<div class="container">


  <div class="logo">
    📱
  </div>


  <h1>
    SMART ATTENDANCE
  </h1>


  <div class="subtitle">
    IMBAS • REKOD • ANALISIS
  </div>



  <button
    id="startButton"
    onclick="startScanner()"
  >

    📷 AKTIFKAN KAMERA

  </button>



  <div id="reader"></div>



  <div id="result">

    <div class="icon">
      📷
    </div>

    <div class="waiting">
      Tekan AKTIFKAN KAMERA untuk bermula
    </div>

  </div>



  <div class="small">
    Smart Attendance System
  </div>


  <button
    id="settingsButton"
    onclick="ubahApiUrl()"
  >
    Tetapan sistem
  </button>


</div>



<script>


// =================================================
// SMART ATTENDANCE
// =================================================


// =================================================
// API URL
// Disimpan dalam browser
// =================================================

let API_URL =
  localStorage.getItem(
    "smartAttendanceApiUrl"
  ) || "";



// =================================================
// PEMBOLEH UBAH SCANNER
// =================================================

let scanner = null;

let processing = false;

let cameraRunning = false;



// =================================================
// SISTEM AUDIO
// =================================================

let audioContext = null;



function initAudio() {

  try {

    if (!audioContext) {

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }


    if (
      audioContext.state ===
      "suspended"
    ) {

      audioContext.resume();

    }

  }

  catch (error) {

    console.log(
      "Audio tidak disokong:",
      error
    );

  }

}



// =================================================
// MAIN BEEP FUNCTION
// =================================================

function playTone(
  frequency,
  duration,
  volume = 0.25
) {


  try {


    if (!audioContext) {

      initAudio();

    }


    if (!audioContext) {
      return;
    }


    const oscillator =
      audioContext.createOscillator();


    const gain =
      audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
      audioContext.destination
    );


    oscillator.type =
      "sine";


    oscillator.frequency.value =
      frequency;


    gain.gain.setValueAtTime(
      volume,
      audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      audioContext.currentTime +
      duration
    );


    oscillator.start();


    oscillator.stop(
      audioContext.currentTime +
      duration
    );


  }

  catch (error) {

    console.log(
      "Sound error:",
      error
    );

  }

}



// =================================================
// BUNYI BERJAYA
// =================================================

function soundSuccess() {


  // Ding dua nada yang lembut

  playTone(
    880,
    0.12,
    0.30
  );


  setTimeout(
    function() {

      playTone(
        1175,
        0.18,
        0.25
      );

    },

    100

  );

}



// =================================================
// BUNYI DUPLIKAT
// =================================================

function soundDuplicate() {


  playTone(
    550,
    0.12,
    0.25
  );


  setTimeout(
    function() {

      playTone(
        550,
        0.12,
        0.25
      );

    },

    180

  );

}



// =================================================
// BUNYI ERROR
// =================================================

function soundError() {


  playTone(
    230,
    0.35,
    0.25
  );

}



// =================================================
// SIMPAN / UBAH URL APPS SCRIPT
// =================================================

function dapatkanApiUrl() {


  if (
    API_URL &&
    API_URL.includes(
      "script.google.com"
    ) &&
    API_URL.endsWith(
      "/exec"
    )
  ) {

    return true;

  }


  const url =
    prompt(

      "Masukkan URL Google Apps Script Smart Attendance.\n\n" +

      "Pastikan URL berakhir dengan /exec"

    );


  if (!url) {

    return false;

  }


  const cleanUrl =
    url.trim();


  if (
    !cleanUrl.includes(
      "script.google.com"
    ) ||
    !cleanUrl.endsWith(
      "/exec"
    )
  ) {


    alert(
      "URL tidak sah.\n\n" +
      "Pastikan URL Google Apps Script berakhir dengan /exec"
    );


    return false;

  }


  API_URL =
    cleanUrl;


  localStorage.setItem(
    "smartAttendanceApiUrl",
    API_URL
  );


  return true;

}



// =================================================
// TUKAR URL APPS SCRIPT
// =================================================

function ubahApiUrl() {


  const url =
    prompt(

      "Masukkan URL Apps Script /exec:",

      API_URL

    );


  if (!url) {

    return;

  }


  const cleanUrl =
    url.trim();


  if (
    !cleanUrl.includes(
      "script.google.com"
    ) ||
    !cleanUrl.endsWith(
      "/exec"
    )
  ) {


    alert(
      "URL tidak sah."
    );


    return;

  }


  API_URL =
    cleanUrl;


  localStorage.setItem(
    "smartAttendanceApiUrl",
    API_URL
  );


  alert(
    "Tetapan Smart Attendance berjaya disimpan."
  );

}



// =================================================
// MULAKAN KAMERA
// =================================================

async function startScanner() {


  // Unlock audio pada iPhone / Android
  initAudio();


  // Pastikan API telah dimasukkan
  if (!dapatkanApiUrl()) {

    return;

  }


  const button =
    document.getElementById(
      "startButton"
    );


  button.disabled =
    true;


  button.innerHTML =
    "⏳ MEMBUKA KAMERA...";


  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">⏳</div>' +

    '<div class="waiting">' +

    'Meminta kebenaran kamera...' +

    '</div>';



  try {


    // =================================================
    // DAPATKAN SENARAI KAMERA
    // =================================================

    const cameras =
      await Html5Qrcode.getCameras();



    if (
      !cameras ||
      cameras.length === 0
    ) {


      throw new Error(
        "Tiada kamera dijumpai."
      );

    }



    // =================================================
    // PILIH KAMERA BELAKANG
    // =================================================

    let selectedCamera =
      cameras[
        cameras.length - 1
      ];



    const rearCamera =
      cameras.find(
        camera => {


          const label =
            (
              camera.label || ""
            ).toLowerCase();



          return (

            label.includes(
              "back"
            ) ||

            label.includes(
              "rear"
            ) ||

            label.includes(
              "environment"
            )

          );

        }
      );



    if (rearCamera) {

      selectedCamera =
        rearCamera;

    }



    // =================================================
    // CIPTA QR SCANNER
    // =================================================

    scanner =
      new Html5Qrcode(
        "reader"
      );



    // =================================================
    // MULAKAN SCANNER
    // =================================================

    await scanner.start(


      selectedCamera.id,


      {

        fps: 10,


        qrbox: {

          width: 250,

          height: 250

        },


        aspectRatio: 1.0

      },


      onScanSuccess,


      function() {

        // Abaikan scan error biasa

      }


    );



    cameraRunning =
      true;



    button.style.display =
      "none";



    readyForNextScan();


  }

  catch (error) {


    console.error(
      error
    );


    cameraRunning =
      false;


    button.disabled =
      false;


    button.innerHTML =
      "📷 CUBA AKTIFKAN KAMERA SEMULA";


    document.getElementById(
      "result"
    ).innerHTML =

      '<div class="icon">❌</div>' +

      '<div class="title">' +

      'KAMERA TIDAK DAPAT DIBUKA' +

      '</div>' +

      '<div class="time">' +

      escapeHtml(

        error.message ||
        String(error)

      ) +

      '</div>';

  }

}



// =================================================
// QR BERJAYA DIBACA
// =================================================

function onScanSuccess(
  decodedText
) {


  if (processing) {

    return;

  }


  processing =
    true;



  // Pause kamera sementara
  try {

    scanner.pause(true);

  }

  catch (error) {

    console.log(error);

  }



  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">⏳</div>' +

    '<div class="title">' +

    'MEREKOD KEHADIRAN...' +

    '</div>' +

    '<div class="time">' +

    'Sila tunggu sebentar' +

    '</div>';



  // Hantar QR kepada Apps Script
  sendToGoogleSheets(
    decodedText
  );

}



// =================================================
// HANTAR DATA KE GOOGLE APPS SCRIPT
// Menggunakan JSONP
// =================================================

function sendToGoogleSheets(
  qrValue
) {


  const callbackName =

    "smartAttendanceCallback_" +

    Date.now();



  const script =
    document.createElement(
      "script"
    );



  let completed =
    false;



  // =================================================
  // TIMEOUT KESELAMATAN
  // =================================================

  const timeout =
    setTimeout(
      function() {


        if (completed) {

          return;

        }


        completed =
          true;


        soundError();


        document.getElementById(
          "result"
        ).innerHTML =

          '<div class="icon">❌</div>' +

          '<div class="title">' +

          'SAMBUNGAN GAGAL' +

          '</div>' +

          '<div class="time">' +

          'Sila cuba semula.' +

          '</div>';



        cleanupJsonp(
          callbackName,
          script
        );


        prepareNextScan();


      },

      10000

    );



  // =================================================
  // CALLBACK DARIPADA APPS SCRIPT
  // =================================================

  window[
    callbackName
  ] =
    function(data) {


      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeout
      );


      try {


        showResult(
          data
        );


      }

      finally {


        cleanupJsonp(
          callbackName,
          script
        );


      }

    };



  // =================================================
  // BINA URL
  // =================================================

  const url =

    API_URL +

    "?action=scan" +

    "&id=" +

    encodeURIComponent(
      qrValue
    ) +

    "&callback=" +

    encodeURIComponent(
      callbackName
    ) +

    "&t=" +

    Date.now();



  script.src =
    url;



  // =================================================
  // CONNECTION ERROR
  // =================================================

  script.onerror =
    function() {


      if (completed) {

        return;

      }


      completed =
        true;


      clearTimeout(
        timeout
      );


      soundError();


      document.getElementById(
        "result"
      ).innerHTML =

        '<div class="icon">❌</div>' +

        '<div class="title">' +

        'GAGAL HUBUNGI SISTEM' +

        '</div>' +

        '<div class="time">' +

        'Semak sambungan internet.' +

        '</div>';



      cleanupJsonp(
        callbackName,
        script
      );


      prepareNextScan();

    };



  document.body.appendChild(
    script
  );

}



// =================================================
// CLEANUP JSONP
// =================================================

function cleanupJsonp(
  callbackName,
  script
) {


  try {

    delete window[
      callbackName
    ];

  }

  catch (error) {}


  try {

    script.remove();

  }

  catch (error) {}

}



// =================================================
// PAPARKAN KEPUTUSAN
// =================================================

function showResult(
  data
) {


  // =================================================
  // KEHADIRAN BERJAYA
  // =================================================

  if (
    data &&
    data.success
  ) {


    soundSuccess();



    document.getElementById(
      "result"
    ).innerHTML =

      '<div class="icon">✅</div>' +

      '<div class="title">' +

      'KEHADIRAN DIREKOD' +

      '</div>' +

      '<div class="name">' +

      escapeHtml(
        data.nama
      ) +

      '</div>' +

      '<div class="class">' +

      escapeHtml(
        data.kelas
      ) +

      '</div>' +

      '<div class="status">' +

      escapeHtml(
        data.status
      ) +

      '</div>' +

      '<div class="time">' +

      escapeHtml(
        data.masa
      ) +

      '</div>';



    // Getaran pendek
    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        150
      );

    }


    prepareNextScan();


    return;

  }



  // =================================================
  // DUPLIKAT
  // =================================================

  if (
    data &&
    data.duplicate
  ) {


    soundDuplicate();



    document.getElementById(
      "result"
    ).innerHTML =

      '<div class="icon">⚠️</div>' +

      '<div class="title">' +

      'SUDAH DIREKOD' +

      '</div>' +

      '<div class="name">' +

      escapeHtml(
        data.nama
      ) +

      '</div>' +

      '<div class="class">' +

      escapeHtml(
        data.kelas || ""
      ) +

      '</div>' +

      '<div class="time">' +

      'Kehadiran hari ini sudah direkod.' +

      '</div>';



    // Getaran dua kali
    if (
      navigator.vibrate
    ) {

      navigator.vibrate(
        [
          100,
          80,
          100
        ]
      );

    }


    prepareNextScan();


    return;

  }



  // =================================================
  // QR / ID TIDAK SAH
  // =================================================

  soundError();



  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">❌</div>' +

    '<div class="title">' +

    'QR TIDAK SAH' +

    '</div>' +

    '<div class="time">' +

    escapeHtml(

      data &&
      data.message

      ?

      data.message

      :

      "ID tidak dijumpai"

    ) +

    '</div>';



  if (
    navigator.vibrate
  ) {

    navigator.vibrate(
      [
        200,
        100,
        200
      ]
    );

  }



  prepareNextScan();

}



// =================================================
// SEDIA UNTUK MURID SETERUSNYA
// =================================================

function prepareNextScan() {


  // Paparkan keputusan
  // selama 1.5 saat

  setTimeout(
    function() {


      processing =
        false;



      readyForNextScan();



      try {


        if (
          scanner &&
          cameraRunning
        ) {

          scanner.resume();

        }


      }

      catch (error) {

        console.log(
          error
        );

      }


    },

    1500

  );

}



// =================================================
// PAPARAN SCANNER READY
// =================================================

function readyForNextScan() {


  document.getElementById(
    "result"
  ).innerHTML =

    '<div class="icon">📷</div>' +

    '<div class="waiting">' +

    'Sila imbas QR murid' +

    '</div>';

}



// =================================================
// KESELAMATAN PAPARAN TEKS
// =================================================

function escapeHtml(
  text
) {


  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null

      ? ""

      : String(text);


  return div.innerHTML;

}


</script>


</body>

</html>
